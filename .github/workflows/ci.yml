name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - run: dotnet restore backend/SupportDesk.sln
      - run: dotnet format backend/SupportDesk.sln --verify-no-changes --no-restore
      - run: dotnet build backend/SupportDesk.sln --configuration Release --no-restore
      - run: dotnet test backend/SupportDesk.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
      - run: dotnet list backend/SupportDesk.sln package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm lint
      - working-directory: frontend
        run: pnpm test
      - working-directory: frontend
        run: pnpm build
      - working-directory: frontend
        run: pnpm audit --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
